name: Desktop apps (Windows & Linux)

# Builds the Electron apps in desktop/. The macOS app is built locally (macos/build.sh) because it is
# signed and notarized with a personal Developer ID.
#   - Run it by hand from the Actions tab to get the installers as downloadable artifacts.
#   - Push a tag like v1.0.0 and the installers are attached to that tag's GitHub release too.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows-x64, os: windows-latest, cmd: "npm run build:win" }
          - { name: Linux-x64, os: ubuntu-latest, cmd: "npm run build:linux" }
          # arm64 builds the AppImage only, because electron-builder's bundled fpm (for .deb) is x64-only
          - { name: Linux-arm64, os: ubuntu-24.04-arm, cmd: "node desktop/fetch-node.mjs linux arm64 && npx electron-builder --config desktop/electron-builder.yml --linux AppImage --arm64 --publish never" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'  # unsigned for now

      # Install the built packages the way a user would, start the app and check the farm answers.
      # (Checks packaging, the bundled Node and the server; the tray and window need a real screen.)
      - name: Install and smoke-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter '*-setup.exe' | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'agent-farm.exe' | Select-Object -First 1
          if (-not $exe) { throw 'agent-farm.exe was not installed' }
          Write-Host "installed: $($exe.FullName)"
          node desktop/smoke-test.mjs $exe.FullName
      - name: Install and smoke-test (Linux .deb)
        if: runner.os == 'Linux' && hashFiles('dist/*.deb') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ./dist/*.deb
          xvfb-run -a node desktop/smoke-test.mjs "$(command -v agent-farm)" --no-sandbox
      - name: Smoke-test (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          chmod +x dist/*.AppImage
          # unpack it (runners have no FUSE) and test the app inside, so the test kills the real
          # Electron process and not the AppImage launcher around it
          (cd dist && ./*.AppImage --appimage-extract >/dev/null)
          xvfb-run -a node desktop/smoke-test.mjs dist/squashfs-root/agent-farm --no-sandbox

      - uses: actions/upload-artifact@v4
        with:
          name: AgentFarm-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: installers, merge-multiple: true }
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --clobber
